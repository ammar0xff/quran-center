name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cloud Functions unit tests (also builds lib/)
        working-directory: firebase/functions
        run: npm ci && npm test
      - name: Security Rules tests (Firestore emulator)
        working-directory: firebase/rules-tests
        run: npm ci && npm test
      - name: Cloud Functions integration tests (Auth + Firestore + Functions emulators)
        working-directory: firebase/rules-tests
        run: npm run test:functions
