name: quran_center
description: Premium Quran Memorization Center Management System (Arabic-first, Flutter + Firebase).
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & dependency injection
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Firebase
  # Firebase (versions resolved by flutter pub add; recorded in pubspec.lock)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  firebase_app_check: ^0.5.1
  firebase_crashlytics: ^6.0.1

  # Local persistence (offline outbox)
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.19
  path: ^1.9.0
  path_provider: ^2.1.2

  # Models
  freezed: ^2.4.7
  json_annotation: ^4.8.1

  # Localization
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.3.3
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.2.2
  cloud_functions: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  mockito: ^5.4.4
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
  assets: []

flutter_intl:
  enabled: true
  main_locale: ar
  class_name: S
